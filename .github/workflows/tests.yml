name: Tests

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: ./scripts/package.sh
      - run: unzip -t dist/Renoise-Osc-Sequencer.xrnx
